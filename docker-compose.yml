version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: narok-talk-sasa-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
      - DATA_FILE=/app/database/data.json
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/database:/app/database
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: narok-talk-sasa-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
