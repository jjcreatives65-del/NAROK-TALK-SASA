<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3f32" />
      <stop offset="100%" stop-color="#0e231b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe26" />
      <stop offset="100%" stop-color="#ffad00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Shield / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#forestGrad)" />
  
  <!-- Outer Ring in Gold -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.8" stroke-dasharray="24 12" />
  
  <!-- Inner Disc -->
  <circle cx="256" cy="256" r="180" fill="#142c22" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Radio Waves Antenna -->
  <path d="M 176 180 A 110 110 0 0 1 336 180" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />
  <path d="M 204 205 A 70 70 0 0 1 308 205" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Center Monogram "TS" -->
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="125" fill="#ffffff" text-anchor="middle" filter="url(#glow)">TS</text>
  
  <!-- Subtitle Pill -->
  <rect x="156" y="365" width="200" height="42" rx="21" fill="url(#goldGrad)" />
  <text x="256" y="393" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#1e3f32" text-anchor="middle" letter-spacing="2">TALK SASA</text>
</svg>
